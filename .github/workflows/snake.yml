name: Generate contribution snake

on:
  push:
    branches:
      - main
  schedule:
    # Run once per hour, every day.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generate snake animation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#0ea5e9&color_dots=#eff2f5,#aceebb,#4ac26b,#2da44e,#116329
            dist/github-contribution-grid-snake-dark.svg?color_snake=#22d3ee&color_dots=#151b23,#033a16,#196c2e,#2ea043,#56d364

      - name: Keep snake inside the grid and respawn eaten commits
        run: node scripts/postprocess-snake.mjs dist/github-contribution-grid-snake.svg dist/github-contribution-grid-snake-dark.svg

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          git diff --cached --quiet && exit 0
          git commit -m "Generate contribution snake"
          git push origin HEAD:${{ github.ref_name }}
